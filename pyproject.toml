[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-sigmoid"
version = "0.1.2"
description = "High-performance sigmoid attention kernels using Triton"
authors = [
    {name = "Vijay Sadashivaiah (MSD)"},
    {name = "Soumya Ghosh (MSD)"},
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["attention", "triton", "gpu", "deep-learning", "pytorch", "sigmoid-attention"]
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "black>=24.3",
    "isort>=5.0",
    "ruff>=0.11.0",
    "pre-commit>=4.0.1",
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
skip-string-normalization = true
line-length = 120

[tool.ruff]
line-length = 120
exclude = ["jupyter_notebook_config.py"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
]
ignore = [
    "E501",
    "C901",
    "E731",
    "F821",
]

[tool.ruff.lint.isort]
order-by-type = true
relative-imports-order = "closest-to-furthest"
extra-standard-library = ["typing"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["triton_sigmoid"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
